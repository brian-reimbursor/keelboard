services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keelboard
      POSTGRES_PASSWORD: keelboard
      POSTGRES_DB: keelboard
    ports:
      - "5432:5432"
    volumes:
      - keelboard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keelboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 4000
      DATABASE_URL: postgres://keelboard:keelboard@postgres:5432/keelboard
      DEMO_MODE: "true"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  keelboard_pg:
